<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="/favicon.svg">
  <!--seo-->
  <link rel="preload" href="/fonts/inter.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/instrument-serif.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/calendar.css">

<body>
  <header data-header></header>

  <main class="container property" data-property>
    <div class="skeleton property-loading"></div>
  </main>

  <dialog class="lightbox" data-lightbox>
    <button class="lightbox__close" type="button" data-close aria-label="Fechar">×</button>
    <button class="lightbox__arrow lightbox__arrow--prev" type="button" data-step="-1" aria-label="Anterior">←</button>
    <img alt="">
    <button class="lightbox__arrow lightbox__arrow--next" type="button" data-step="1" aria-label="Seguinte">→</button>
    <p class="lightbox__count"></p>
  </dialog>

  <footer data-footer></footer>
  <!--data-->
</body>
