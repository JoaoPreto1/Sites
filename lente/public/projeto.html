<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="/favicon.svg">
  <!--seo-->
  <link rel="preload" href="/fonts/archivo.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/jetbrains-mono.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/lightbox.css">
  <link rel="stylesheet" href="/css/pages/projeto.css">
  <script type="module" src="/js/layout.js"></script>
  <script type="module" src="/js/pages/projeto.js"></script>
</head>
<body>
  <header data-header></header>

  <main data-project>
    <div class="skeleton project-loading"></div>
  </main>

  <dialog class="lightbox" data-lightbox>
    <div class="lightbox__bar mono"><span data-lightbox-count></span><button type="button" data-close>Fechar ✕</button></div>
    <img alt="">
    <button class="lightbox__arrow lightbox__arrow--prev" type="button" data-step="-1" aria-label="Anterior">←</button>
    <button class="lightbox__arrow lightbox__arrow--next" type="button" data-step="1" aria-label="Seguinte">→</button>
  </dialog>

  <footer data-footer></footer>
  <!--data-->
</body>
</html>
