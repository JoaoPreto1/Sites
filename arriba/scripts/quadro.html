<!doctype html>
<html lang="pt-PT"><head><meta charset="utf-8"><title>Quadro</title>
<style>html,body{margin:0;height:100%;background:#1d332c}canvas{display:block;width:100vw;height:100vh}</style></head>
<body><canvas id="c"></canvas>
<script type="module">
import { quadroDeChaves } from '../public/js/quadro/chaves3d.js';
const p = new URLSearchParams(location.search);
const quartos = Array.from({ length: 14 }, (_, i) => ({ num: String(i + 1).padStart(2, '0') }));
const livres = (p.get('livres') ?? quartos.map((q) => q.num).join(',')).split(',');
const q = quadroDeChaves(document.getElementById('c'), { quartos, livres, escolhido: p.get('e'), perto: p.has('perto') });
q.pronto.then(() => setTimeout(() => (document.body.dataset.ready = '1'), 1500));
</script></body></html>
